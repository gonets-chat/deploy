map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name openverse.site;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://openverse.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name openverse.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/openverse.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openverse.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/openverse-app.conf;
}
