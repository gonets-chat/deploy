map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP bootstrap used until Let's Encrypt issues the certificate.
server {
    listen 80;
    server_name openverse.site;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/openverse-app.conf;
}
